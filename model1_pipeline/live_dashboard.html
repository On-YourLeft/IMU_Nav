<!DOCTYPE html>
<html>
<head>
    <title>Live AI Telemetry</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;}
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; text-align: center; }
        .val { font-size: 3rem; color: #38bdf8; font-weight: bold; }
        .chart-container { background: #1e1e1e; padding: 20px; border-radius: 8px; height: 300px; }
    </style>
</head>
<body>
    <h2>Live Model 1 Inference (Stateful AI)</h2>
    <div class="grid">
        <div class="card"><h3>AI Forward Speed</h3><div class="val" id="speed">0.0 km/h</div></div>
        <div class="card"><h3>AI Lean Angle</h3><div class="val" id="lean">0.0 °</div></div>
    </div>
    <div class="chart-container"><canvas id="liveChart"></canvas></div>

    <script>
        const ctx = document.getElementById('liveChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Speed (km/h)', data: [], borderColor: '#38bdf8', borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: false }
        });

        const ws = new WebSocket("ws://localhost:8765");
        let counter = 0;

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            document.getElementById('speed').innerText = data.speed_kmh.toFixed(1) + " km/h";
            document.getElementById('lean').innerText = data.lean_deg.toFixed(1) + " °";

            chart.data.labels.push(counter++);
            chart.data.datasets[0].data.push(data.speed_kmh);
            if(chart.data.labels.length > 50) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();
        };
    </script>
</body>
</html>
